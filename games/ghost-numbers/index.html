      &lt;div class=&quot;gn-fields&quot;&gt;&lt;label&gt;&lt;span class=&quot;gn-a-label&quot;&gt;Your guess · real part a&lt;/span&gt;&lt;input type=&quot;number&quot; inputmode=&quot;numeric&quot; id=&quot;gn-coordinate-a&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;1&quot; aria-label=&quot;Real coordinate a&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;span class=&quot;gn-b-label&quot;&gt;Your guess · i coefficient b&lt;/span&gt;&lt;input type=&quot;number&quot; inputmode=&quot;numeric&quot; id=&quot;gn-coordinate-b&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;1&quot; aria-label=&quot;Imaginary coefficient b&quot;&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;gn-error&quot; role=&quot;alert&quot; hidden&gt;&lt;/div&gt;
      &lt;div class=&quot;gn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gn-button gn-primary cursor-interaction&quot; data-action=&quot;run&quot; disabled&gt;Play the move →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;gn-button gn-primary cursor-interaction&quot; data-action=&quot;next&quot; hidden&gt;Next mission →&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;gn-secondary-actions&quot; hidden&gt;&lt;button type=&quot;button&quot; class=&quot;gn-button cursor-interaction&quot; data-action=&quot;undo&quot; disabled&gt;Undo move&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;gn-button cursor-interaction&quot; data-action=&quot;reset&quot;&gt;Start at 2 + i&lt;/button&gt;&lt;/div&gt;
      &lt;details class=&quot;gn-details&quot;&gt;&lt;summary&gt;What this move means&lt;/summary&gt;&lt;p class=&quot;gn-math&quot;&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;One number, two coordinates.&lt;/b&gt; In a + bi, a is the real part and b is the imaginary part. The point is (a, b). “Imaginary” is a historical name; it does not mean made-up. The number i is defined by i² = −1.&lt;/p&gt;&lt;p&gt;&lt;b&gt;3D View changes the camera.&lt;/b&gt; Real and imaginary coordinates stay on one plane. Drag to tilt it, or choose Flat View to see lengths and right angles without foreshortening. Camera movement never changes your number or your prediction.&lt;/p&gt;&lt;p&gt;This is an introduction using small whole-number coordinates. Complex numbers can also have fractional and other real-valued coordinates. The trails illustrate operations; they are not physical journeys.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;gn-details&quot;&gt;&lt;summary&gt;Sources and teaching approach&lt;/summary&gt;&lt;p&gt;Based on the complex-plane representation and arithmetic, with visual precedents from &lt;a href=&quot;https://www.mathsisfun.com/algebra/complex-number-multiply.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Maths Is Fun&lt;/a&gt;, &lt;a href=&quot;https://www.geogebra.org/m/vywhkypt&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GeoGebra’s arithmetic-and-geometry applet&lt;/a&gt;, and &lt;a href=&quot;https://help.desmos.com/hc/en-us/articles/31103542590733-Complex-Numbers&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Desmos Complex Mode&lt;/a&gt;. This game’s prediction missions and artwork were made for SpookyQubits. Learning gains have not been evaluated.&lt;/p&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;div class=&quot;gn-live&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;script&gt;
  (()=&gt;{
    &#x27;use strict&#x27;;
    const root=document.getElementById(&#x27;ghost-numbers-preview&#x27;),app=root.querySelector(&#x27;.gn-app&#x27;),$=s=&gt;root.querySelector(s),svg=$(&#x27;.gn-plane&#x27;),plot=$(&#x27;.gn-plot&#x27;);
    const clean=n=&gt;Math.abs(n)&lt;1e-9?0:Math.round(n*1e8)/1e8;
    function valid(z){return Array.isArray(z)&amp;&amp;z.length===2&amp;&amp;z.every(Number.isFinite);}
    const add=(z,w)=&gt;z.map((n,i)=&gt;clean(n+w[i]));
    const multiply=(z,w)=&gt;[clean(z[0]*w[0]-z[1]*w[1]),clean(z[0]*w[1]+z[1]*w[0])];
    function fmt(z){const a=clean(z[0]),b=clean(z[1]),im=Math.abs(b)===1?&#x27;i&#x27;:Math.abs(b)+&#x27;i&#x27;;return b===0?String(a):a===0?(b&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+im:a+(b&lt;0?&#x27; − &#x27;:&#x27; + &#x27;)+im;}
    const OPS={right:{kind:&#x27;add&#x27;,n:[1,0],label:&#x27;+ 1&#x27;,short:&#x27;Slide right&#x27;},up:{kind:&#x27;add&#x27;,n:[0,1],label:&#x27;+ i&#x27;,short:&#x27;Slide up&#x27;},diagonal:{kind:&#x27;add&#x27;,n:[1,1],label:&#x27;+ (1 + i)&#x27;,short:&#x27;Two steps&#x27;},turn:{kind:&#x27;multiply&#x27;,n:[0,1],label:&#x27;× i&#x27;,short:&#x27;Quarter-turn&#x27;},stretch:{kind:&#x27;multiply&#x27;,n:[2,0],label:&#x27;× 2&#x27;,short:&#x27;Twice as far&#x27;},both:{kind:&#x27;multiply&#x27;,n:[1,1],label:&#x27;× (1 + i)&#x27;,short:&#x27;Turn &amp; grow&#x27;}};
    const LESSONS=[
      {title:&#x27;A number with two directions&#x27;,intro:&#x27;Start at 0. Add 2 + i. Predict the new point.&#x27;,stages:[{z:[0,0],op:{kind:&#x27;add&#x27;,n:[2,1],label:&#x27;+ (2 + i)&#x27;}}],why:&#x27;2 + i is one complex number: 2 along the real axis and 1 along the imaginary axis.&#x27;},
      {title:&#x27;Add i: slide the point&#x27;,intro:&#x27;Start at 2 + i. Add i. Where will the ghost land?&#x27;,stages:[{z:[2,1],op:OPS.up}],why:&#x27;Adding i increases only the imaginary coordinate: (2, 1) becomes (2, 2). The point slides one unit up.&#x27;},
      {title:&#x27;Multiply by i: turn the arrow&#x27;,intro:&#x27;Same starting number, 2 + i. This time multiply by i.&#x27;,stages:[{z:[2,1],op:OPS.turn}],why:&#x27;Multiplying by i turns the whole arrow 90° counterclockwise around zero. (2, 1) becomes (−1, 2). Adding i would have landed at 2 + 2i instead.&#x27;},
      {title:&#x27;Two quarter-turns make −1&#x27;,intro:&#x27;Begin at 1. Multiply by i twice, predicting one turn at a time.&#x27;,stages:[{z:[1,0],op:OPS.turn},{z:[0,1],op:OPS.turn}],why:&#x27;The turns take 1 → i → −1. So 1 × i × i = −1, which shows i² = −1.&#x27;},
      {title:&#x27;Stretch without changing direction&#x27;,intro:&#x27;Start at 1 + i. Multiply by 2.&#x27;,stages:[{z:[1,1],op:OPS.stretch}],why:&#x27;Both coordinates double. The arrow points the same way and becomes twice as long: 1 + i becomes 2 + 2i.&#x27;},
      {title:&#x27;A turn and a stretch together&#x27;,intro:&#x27;Final challenge: start at 1 + i, then multiply by 1 + i.&#x27;,stages:[{z:[1,1],op:OPS.both}],why:&#x27;Multiplying by 1 + i turns the arrow 45° counterclockwise and stretches its length by √2. The result is 2i. Watch the new direction and distance, then compare the coordinates.&#x27;}
    ];
    function result(z,op){if(!valid(z)||!op||!valid(op.n)||![&#x27;add&#x27;,&#x27;multiply&#x27;].includes(op.kind))throw Error(&#x27;Invalid complex-number operation&#x27;);const out=op.kind===&#x27;add&#x27;?add(z,op.n):multiply(z,op.n);if(!valid(out))throw Error(&#x27;Result is too large&#x27;);return out;}
    function sample(z,op,t){
      if(!Number.isFinite(t)||t&lt;0||t&gt;1)throw Error(&#x27;Invalid animation progress&#x27;);const end=result(z,op);if(t===0)return z.slice();if(t===1)return end;
      if(op.kind===&#x27;add&#x27;){const total=Math.abs(op.n[0])+Math.abs(op.n[1]),split=total?Math.abs(op.n[0])/total:0;return split===0?[z[0],z[1]+op.n[1]*t]:split===1?[z[0]+op.n[0]*t,z[1]]:t&lt;split?[z[0]+op.n[0]*t/split,z[1]]:[z[0]+op.n[0],z[1]+op.n[1]*(t-split)/(1-split)];}
      const angle=Math.atan2(op.n[1],op.n[0])*t,scale=1+(Math.hypot(...op.n)-1)*t,c=Math.cos(angle),s=Math.sin(angle);return [(z[0]*c-z[1]*s)*scale,(z[0]*s+z[1]*c)*scale];
    }
    const S={mode:&#x27;missions&#x27;,mission:0,step:0,phase:&#x27;ready&#x27;,guess:null,records:{},free:[2,1],freeOp:&#x27;turn&#x27;,history:[],last:null};
    const camera={view:&#x27;3d&#x27;,yaw:-.28,tilt:.72};
    let animation=null,frame=0,geometry=null,lastWidth=0,drag=null,ignorePlotClickUntil=0,lastSnapshot=null;
    const key=()=&gt;S.mission+&#x27;:&#x27;+S.step;
    const stage=()=&gt;LESSONS[Math.min(S.mission,5)].stages[S.step]||LESSONS[5].stages[0];
    const context=()=&gt;S.mode===&#x27;missions&#x27;?stage():{z:S.free,op:OPS[S.freeOp]};
    function meaning(op){if(op.kind===&#x27;add&#x27;){const [a,b]=op.n;return &#x27;Addition shifts the point by &#x27;+(a?a+&#x27; real unit&#x27;+(Math.abs(a)===1?&#x27;&#x27;:&#x27;s&#x27;):&#x27;no real units&#x27;)+&#x27; and &#x27;+(b?b+&#x27; imaginary unit&#x27;+(Math.abs(b)===1?&#x27;&#x27;:&#x27;s&#x27;):&#x27;no imaginary units&#x27;)+&#x27;. Add the two coordinates separately.&#x27;;}if(op.n[0]===0&amp;&amp;op.n[1]===1)return &#x27;Multiplying by i makes a 90° counterclockwise turn around zero. The distance from zero stays the same. The rule is (a, b) → (−b, a). This differs from adding i, which just moves the point up.&#x27;;if(op.n[0]===2&amp;&amp;op.n[1]===0)return &#x27;Multiplying by 2 doubles both coordinates and the distance from zero. It keeps the direction of every nonzero arrow. Zero stays zero.&#x27;;return &#x27;Multiplying by 1 + i turns by 45° counterclockwise and multiplies the distance from zero by √2, about 1.41. In coordinates, (a + bi)(1 + i) = (a − b) + (a + b)i.&#x27;;}
    function stop(){cancelAnimationFrame(frame);frame=0;animation=null;}
    function save(){const data={modelContent:{game:&#x27;Ghost Numbers&#x27;,mode:S.mode,mission:S.mission+1,view:camera.view},privateContent:{...S,camera:{...camera},last:S.last?{from:S.last.from,opId:S.last.opId}:null}};lastSnapshot=JSON.stringify(data);try{window.openai?.setWidgetState?.(data)?.catch(()=&gt;{});}catch(_){}}
    function restore(data){
      const p=data?.privateContent;if(!p||typeof p!==&#x27;object&#x27;)return;
      if(p.camera&amp;&amp;typeof p.camera===&#x27;object&#x27;){
        if([&#x27;3d&#x27;,&#x27;flat&#x27;].includes(p.camera.view))camera.view=p.camera.view;
        if(Number.isFinite(p.camera.yaw))camera.yaw=Math.max(-.65,Math.min(.65,p.camera.yaw));
        if(Number.isFinite(p.camera.tilt))camera.tilt=Math.max(.25,Math.min(1.08,p.camera.tilt));
      }
      if([&#x27;missions&#x27;,&#x27;free&#x27;].includes(p.mode))S.mode=p.mode;
      if(Number.isInteger(p.mission)&amp;&amp;p.mission&gt;=0&amp;&amp;p.mission&lt;=5)S.mission=p.mission;
      if(Number.isInteger(p.step)&amp;&amp;LESSONS[S.mission].stages[p.step])S.step=p.step;
      if([&#x27;ready&#x27;,&#x27;result&#x27;,&#x27;finish&#x27;].includes(p.phase))S.phase=p.phase;
      if(valid(p.guess)&amp;&amp;p.guess.every(n=&gt;Number.isInteger(n)&amp;&amp;Math.abs(n)&lt;=3))S.guess=p.guess;
      if(valid(p.free)&amp;&amp;p.free.every(n=&gt;Number.isInteger(n)&amp;&amp;Math.abs(n)&lt;=12))S.free=p.free;
      if(OPS[p.freeOp])S.freeOp=p.freeOp;
      if(Array.isArray(p.history))S.history=p.history.filter(z=&gt;valid(z)&amp;&amp;z.every(n=&gt;Number.isInteger(n)&amp;&amp;Math.abs(n)&lt;=12)).slice(-16);
      if(p.records&amp;&amp;typeof p.records===&#x27;object&#x27;)for(const [k,r]of Object.entries(p.records)){const [m,s]=k.split(&#x27;:&#x27;).map(Number);if(LESSONS[m]?.stages[s]&amp;&amp;typeof r.correct===&#x27;boolean&#x27;&amp;&amp;valid(r.guess)&amp;&amp;r.guess.every(n=&gt;Number.isInteger(n)&amp;&amp;Math.abs(n)&lt;=3))S.records[k]={correct:r.correct,guess:r.guess.map(clean)};}
      if(S.phase===&#x27;result&#x27;&amp;&amp;!S.records[key()])S.phase=&#x27;ready&#x27;;
      if(S.phase===&#x27;finish&#x27;&amp;&amp;Object.keys(S.records).length!==7)S.phase=&#x27;ready&#x27;;
    }
    function drawPlane(){
      const width=Math.max(260,Math.round(plot.getBoundingClientRect().width||plot.clientWidth||360));
      const side=Math.min(252,width-72),height=side+85,cx=width/2,cy=44+side/2;
      const c=animation||(S.mode===&#x27;free&#x27;&amp;&amp;S.last?{z:S.last.from,op:OPS[S.last.opId]}:context());
      const from=animation?animation.from:c.z,op=c.op,to=result(from,op);
      const displayed=animation?sample(from,op,animation.t):S.mode===&#x27;missions&#x27;&amp;&amp;S.phase!==&#x27;ready&#x27;?to:S.mode===&#x27;free&#x27;?S.free:from;
      const radial=op.kind===&#x27;multiply&#x27;?Math.max(Math.hypot(...from),Math.hypot(...to)):Math.max(...from.map(Math.abs),...to.map(Math.abs));
      const bound=S.mode===&#x27;missions&#x27;?3:Math.min(18,Math.max(3,Math.ceil(radial)));
      const tilted=camera.view===&#x27;3d&#x27;,yaw=tilted?camera.yaw:0,tilt=tilted?camera.tilt:0;
      const co=Math.cos(yaw),si=Math.sin(yaw),foreshorten=Math.cos(tilt),extent=Math.abs(co)+Math.abs(si);

      const left=Math.min(...corners.map(p=&gt;p.x)),top=Math.min(...corners.map(p=&gt;p.y));
      geometry={width,height,side,left,top,bound,unit,project,unproject,corners,view:camera.view};lastWidth=width;
      const pt=p=&gt;p.x.toFixed(3)+&#x27;,&#x27;+p.y.toFixed(3);
      const segment=(a,b)=&gt;&#x27;M&#x27;+pt(project(a))+&#x27;L&#x27;+pt(project(b));

      const norm=v=&gt;{const d=Math.hypot(...v);return v.map(n=&gt;n/d);};

      const realNormal=[-realDirection[1],realDirection[0]],imagNormal=[imagDirection[1],-imagDirection[0]];
      const zero=project([0,0]),point=project(displayed),start=project(from);
      const pick=S.mode===&#x27;missions&#x27;&amp;&amp;S.phase!==&#x27;finish&#x27;?S.guess:null;
      let grid=&#x27;&#x27;,ticks=&#x27;&#x27;;const gridStep=bound&lt;=6?1:2;
      for(let n=-bound;n&lt;=bound;n+=gridStep)if(n){

      }
      const tickVals=bound===3?[-3,-1,1,3]:[-bound,-Math.ceil(bound/2),Math.ceil(bound/2),bound];
      for(const n of tickVals){
        const x=project([n,0]),y=project([0,n]);
        ticks+=`&lt;text x=&quot;${x.x+realNormal[0]*27}&quot; y=&quot;${x.y+realNormal[1]*27+4}&quot; text-anchor=&quot;middle&quot;&gt;${n&lt;0?&#x27;−&#x27;+Math.abs(n):n}&lt;/text&gt;&lt;text x=&quot;${y.x+imagNormal[0]*22}&quot; y=&quot;${y.y+imagNormal[1]*22+4}&quot; text-anchor=&quot;end&quot;&gt;${fmt([0,n])}&lt;/text&gt;`;
      }
      const re=project([bound,0]),im=project([0,bound]);
      const axis=`&lt;path d=&quot;${segment([-bound,0],[bound,0])}&quot; stroke=&quot;var(--gn-blue)&quot; stroke-width=&quot;2.2&quot; fill=&quot;none&quot;/&gt;&lt;path d=&quot;${segment([0,-bound],[0,bound])}&quot; stroke=&quot;var(--gn-purple)&quot; stroke-width=&quot;2.2&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;${re.x+realNormal[0]*44+realDirection[0]*5}&quot; y=&quot;${re.y+realNormal[1]*44+4}&quot; text-anchor=&quot;end&quot; class=&quot;gn-axis-title&quot;&gt;Real&lt;/text&gt;&lt;text x=&quot;${im.x+imagDirection[0]*27}&quot; y=&quot;${im.y+imagDirection[1]*27}&quot; text-anchor=&quot;middle&quot; class=&quot;gn-axis-title&quot;&gt;Imaginary&lt;/text&gt;`;
      const foot=project([displayed[0],0]);
      const components=`&lt;path data-component=&quot;real&quot; d=&quot;M${pt(zero)}L${pt(foot)}&quot; fill=&quot;none&quot; stroke=&quot;var(--gn-blue)&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;path data-component=&quot;imaginary&quot; d=&quot;M${pt(foot)}L${pt(point)}&quot; fill=&quot;none&quot; stroke=&quot;var(--gn-purple)&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`;
      const showTrail=animation||S.mode===&#x27;missions&#x27;&amp;&amp;S.phase===&#x27;result&#x27;||S.mode===&#x27;free&#x27;&amp;&amp;S.last;
      const pathFrom=S.mode===&#x27;free&#x27;&amp;&amp;!animation&amp;&amp;S.last?S.last.from:from;
      const pathOp=S.mode===&#x27;free&#x27;&amp;&amp;!animation&amp;&amp;S.last?OPS[S.last.opId]:op;
      const samples=showTrail?Array.from({length:61},(_,i)=&gt;project(sample(pathFrom,pathOp,i/60))):[];
      const trail=samples.length?`&lt;path data-motion-trail=&quot;true&quot; d=&quot;${path(samples)}&quot; fill=&quot;none&quot; stroke=&quot;var(--gn-purple)&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;4 4&quot;/&gt;`:&#x27;&#x27;;
      function ring(z,pixels,attrs){const r=pixels/unit;return `&lt;path d=&quot;${path(Array.from({length:49},(_,i)=&gt;project([z[0]+r*Math.cos(i/48*2*Math.PI),z[1]+r*Math.sin(i/48*2*Math.PI)])))}Z&quot; ${attrs}/&gt;`;}
      const previous=showTrail?ring(pathFrom,7,&#x27;fill=&quot;var(--gn-white)&quot; stroke=&quot;var(--gn-muted)&quot; stroke-width=&quot;1.5&quot;&#x27;):&#x27;&#x27;;
      const comparison=S.mode===&#x27;missions&#x27;&amp;&amp;S.mission===2&amp;&amp;S.phase===&#x27;result&#x27;&amp;&amp;!animation?`&lt;g opacity=&quot;.7&quot;&gt;${ring([2,2],8,&#x27;fill=&quot;none&quot; stroke=&quot;var(--gn-purple)&quot; stroke-width=&quot;2&quot;&#x27;)}&lt;text x=&quot;${project([2,2]).x-8}&quot; y=&quot;${project([2,2]).y-18}&quot; text-anchor=&quot;end&quot;&gt;+ i result&lt;/text&gt;&lt;/g&gt;`:&#x27;&#x27;;
      const guess=pick?`&lt;g data-guess=&quot;${pick.join(&#x27;,&#x27;)}&quot;&gt;${ring(pick,23,&#x27;fill=&quot;none&quot; stroke=&quot;var(--gn-gold)&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;5 4&quot;&#x27;)}&lt;/g&gt;`:&#x27;&#x27;;
      const arrowLength=Math.hypot(point.x-zero.x,point.y-zero.y),ux=arrowLength?(point.x-zero.x)/arrowLength:0,uy=arrowLength?(point.y-zero.y)/arrowLength:0;
      const arrow=arrowLength&gt;6?`&lt;path d=&quot;M${pt(zero)}L${pt(point)}&quot; stroke=&quot;var(--gn-blue)&quot; stroke-width=&quot;2.2&quot; fill=&quot;none&quot;/&gt;&lt;path d=&quot;M${pt(point)}L${point.x-ux*9-uy*5},${point.y-uy*9+ux*5}L${point.x-ux*9+uy*5},${point.y-uy*9-ux*5}Z&quot; fill=&quot;var(--gn-blue)&quot;/&gt;`:&#x27;&#x27;;
      const shadow=tilted?ring(displayed,12,&#x27;fill=&quot;var(--gn-ink)&quot; opacity=&quot;.13&quot;&#x27;):&#x27;&#x27;;
      const ghost=`&lt;g data-current=&quot;${displayed.map(clean).join(&#x27;,&#x27;)}&quot; transform=&quot;translate(${point.x.toFixed(3)} ${point.y.toFixed(3)})&quot;&gt;&lt;path d=&quot;M-13 10V-2C-13-12-7-17 0-17S13-12 13-2V13L7 9L1 14L-5 10L-11 14Z&quot; fill=&quot;var(--gn-blue)&quot; stroke=&quot;var(--gn-white)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;ellipse cx=&quot;-4.5&quot; cy=&quot;-4&quot; rx=&quot;1.8&quot; ry=&quot;2.4&quot; fill=&quot;var(--gn-white)&quot;/&gt;&lt;ellipse cx=&quot;4.5&quot; cy=&quot;-4&quot; rx=&quot;1.8&quot; ry=&quot;2.4&quot; fill=&quot;var(--gn-white)&quot;/&gt;&lt;path d=&quot;M-3 4Q0 7 3 4&quot; fill=&quot;none&quot; stroke=&quot;var(--gn-white)&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/g&gt;`;
